:root{--green:#0c5a3b;--green2:#073e2a;--cream:#f6f1e7;--gold:#d6a93b;--ink:#17211c;--muted:#6c786f;--card:#fff;--line:#dfe5df}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#061f17,#0c5a3b 55%,#073e2a);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);min-height:100vh}
header{padding:38px 20px 70px;text-align:center;color:white;background:radial-gradient(circle at 50% -40%,#16845b 0,transparent 55%)}
.logo{width:118px;height:118px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 18px #0007)}

main{width:min(1100px,calc(100% - 28px));margin:-38px auto 50px}.card{background:var(--card);border-radius:18px;box-shadow:0 14px 35px #00150d55;margin-bottom:22px;overflow:hidden}.card h2{margin:0;padding:18px 20px;background:var(--cream);font-size:20px;border-bottom:1px solid var(--line)}
